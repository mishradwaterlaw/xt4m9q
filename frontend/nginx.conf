server {
    # Listen on port 80 inside the container
    listen 80;
    server_name localhost;

    # Root directory where compiled Vite static assets reside
    root /usr/share/nginx/html;
    index index.html;

    # Enable Gzip compression to reduce payload transfer sizes
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types
        text/plain
        text/css
        text/xml
        text/javascript
        application/javascript
        application/x-javascript
        application/json
        application/xml
        image/svg+xml;

    # Client-side routing fallback:
    # All paths that do not match a static file return index.html,
    # allowing React Router (e.g. /accuracy) to resolve client-side routes without 404s.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Proxy API calls directly to the backend service over the Docker bridge network
    location /api/ {
        proxy_pass http://backend:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Proxy health probe requests to backend
    location /health {
        proxy_pass http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }
}
